[project]
name = "mythic-core"
version = "0.1.0"
description = "Shared rules data, types and pure rule functions for Mythic TTRPG tools."
readme = "README.md"
authors = [
    { name = "phazeshift-pb", email = "158334073+phazeshift-pb@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
